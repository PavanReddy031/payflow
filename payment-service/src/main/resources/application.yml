server:
  port: 8081

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5433/payflow_payment
    username: payflow
    password: payflow123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  flyway:
    enabled: false
    locations: classpath:/db/migration
    baseline-on-migrate: true

logging:
  level:
    com.payflow: DEBUG
    org.springframework.security: DEBUG